server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /advisor  { proxy_pass http://backend:8000; }
    location /quote    { proxy_pass http://backend:8000; }
    location /kyc      { proxy_pass http://backend:8000; }
    location /tracker  { proxy_pass http://backend:8000; }
    location /propensity { proxy_pass http://backend:8000; }
}
